name: Guest Mesa build

on:
  workflow_call:
  push:
    branches:
      - chore/move-lib-builds-to-public-and-remove-gfxstream
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: RandomCoderOrg/mesa-gfxstream
          ref: 7c8f8371df1c9e359becf9e902ba23b450b739c6
          path: mesa
          persist-credentials: false
      - name: Cache source-built Mesa bundle
        id: mesa-cache
        uses: actions/cache@v6
        with:
          path: mesa-artifacts
          key: guest-mesa-jammy-arm64-v1-7c8f8371df1c9e359becf9e902ba23b450b739c6-${{ hashFiles('tools/build-guest-mesa-bundle.sh', '.github/workflows/mesa-guest.yml', 'app/src/main/assets/runtime/arm64-v8a/venus-mesa/share/**') }}
      - name: Build Mesa bundle
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config python3-pip python3-mako \
            python3-yaml python3-ply python3-jinja2 python3-packaging \
            libdrm-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxshmfence-dev \
            libxxf86vm-dev libxrandr-dev libxcb1-dev libxcb-dri2-0-dev libxcb-dri3-dev \
            libxcb-glx0-dev libxcb-present-dev libxcb-sync-dev libxcb-randr0-dev \
            libxcb-xfixes0-dev libxcb-shm0-dev libvulkan-dev libglvnd-dev \
            libexpat1-dev x11proto-dev zlib1g-dev libzstd-dev
          python3 -m pip install --user 'meson==1.7.2'
          export PATH="$HOME/.local/bin:$PATH"
          bash tools/build-guest-mesa-bundle.sh mesa mesa-artifacts
      - name: Verify Mesa bundle
        run: |
          cd mesa-artifacts
          sha256sum --check --strict SHA256SUMS
          archives=(udroid-mesa-venus_*.tar.gz)
          test "${#archives[@]}" -eq 1
          for path in \
            bin/zink_check_requirements \
            lib/libEGL_mesa.so.0 \
            lib/libGLX_mesa.so.0 \
            lib/libgallium-26.1.5.so \
            lib/libvulkan_virtio.so \
            lib/dri/zink_dri.so; do
            tar -tzf "${archives[0]}" | grep -Fx "venus-mesa/$path"
          done
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          tar -xzf "${archives[0]}" -C "$extracted"
          manifest="$extracted/venus-mesa/MANIFEST.properties"
          grep -Fx 'glibc_min=2.34' "$manifest"
          while IFS='=' read -r key expected; do
            if [[ "$key" == *.sha256 ]]; then
              printf '%s  %s\n' "$expected" "$extracted/venus-mesa/${key%.sha256}" \
                | sha256sum --check --strict -
            fi
          done < "$manifest"
      - uses: actions/upload-artifact@v7
        with:
          name: udroid-mesa-venus-jammy-arm64
          path: mesa-artifacts/*
          if-no-files-found: error
