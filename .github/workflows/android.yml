name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk \
            "release-assets/udroid-${GITHUB_REF_NAME}-debug.apk"
          (
            cd release-assets
            sha256sum "udroid-${GITHUB_REF_NAME}-debug.apk" > SHA256SUMS
          )

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: udroid-${{ github.ref_name }}-debug
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified build assets
        uses: actions/download-artifact@v8
        with:
          name: udroid-${{ github.ref_name }}-debug
          path: release-assets

      - name: Publish tagged prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "uDroid ${GITHUB_REF_NAME}" \
            --notes "Extremely early development build for testing and contributor feedback. Expect breaking changes and incomplete features. This universal debug-signed APK is not a production release."
